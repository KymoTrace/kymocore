[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kymo-configurator"
version = "0.2.0"
description = "KymoCore 8 configuration engine with guided and professional Qt Widgets modes"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8.3,<6.10"]

[project.scripts]
kymo-configurator = "kymo_configurator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
