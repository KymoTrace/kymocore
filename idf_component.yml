# ESP Component Registry manifest. Keep version equal to library.json and
# library.properties (tools/test_package.py checks it). Upload: docs/PUBLISHING.md.
version: "7.3.0"
description: "Portable heap-free C++11 telemetry and opt-in execution tracing for KymoStudio: compact binary frames over UART, USB, TCP, UDP or MQTT through application callbacks."
url: "https://kymotrace.de/kymocore.html"
repository: "https://github.com/KymoTrace/kymocore.git"
documentation: "https://github.com/KymoTrace/kymocore/blob/main/docs/GUIDE.md"
issues: "https://github.com/KymoTrace/kymocore/issues"
license: "MIT"
maintainers:
  - "Christof Seidel <kontakt@kymotrace.de>"
tags:
  - telemetry
  - tracing
  - plotting
  - binary-protocol
  - sensor
  - uart
  - mqtt
dependencies:
  idf: ">=5.0"
files:
  exclude:
    - ".github/**/*"
    - "test/**/*"
    - "tools/**/*"
    - "**/.pio/**/*"
    - "**/.vscode/**/*"
    - "**/__pycache__/**/*"
